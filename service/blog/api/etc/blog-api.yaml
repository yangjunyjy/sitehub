# Local development only. Deploy configs use reachable container addresses.
Name: blog-api
Host: 0.0.0.0
Port: 8802
Timeout: 30000
ServiceKey: ${SERVICE_KEY}
RPC:
  Timeout: 30000
  Target: nacos:///blog-rpc
Mode: dev
Nacos:
  Servers:
  - 127.0.0.1:8848
  NamespaceID: ${NACOS_NAMESPACE_ID}
  Group: SITEHUB
  Username: ${NACOS_USERNAME}
  Password: ${NACOS_PASSWORD}
Registry:
  Enabled: true
  AdvertiseIP: ${SERVICE_ADVERTISE_IP}
  AllowLoopback: true
  MaxStale: 30s
  StartupTimeout: 30s
ConfigCenter:
  Enabled: true
  DataID: blog-api.yaml
Runtime:
  Maintenance: false
  MaxConcurrentRequests: 1000
Shutdown:
  WrapUpTime: 10s
  WaitTime: 75s

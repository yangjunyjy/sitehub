syntax = "proto3";
package product;
option go_package = "./pb/product";
import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

message BoolReply {
  bool value = 1 [json_name = "value"];
}

message DocGroupInput {
  string action = 1 [json_name = "action"];
  string version = 2 [json_name = "version"];
  string title = 3 [json_name = "title"];
  uint64 id = 4 [json_name = "id"];
  uint64 revision = 5 [json_name = "revision"];
  int64 direction = 6 [json_name = "direction"];
}

message DocHistory {
  repeated DocumentRevision items = 1 [json_name = "items"];
}

message DocModeInput {
  string action = 1 [json_name = "action"];
  string id = 2 [json_name = "id"];
  string label = 3 [json_name = "label"];
  string description = 4 [json_name = "description"];
  string icon = 5 [json_name = "icon"];
  string status = 6 [json_name = "status"];
  string default_version = 7 [json_name = "defaultVersion"];
  int64 sort_order = 8 [json_name = "sortOrder"];
  uint64 revision = 9 [json_name = "revision"];
}

message DocSettingsInput {
  string title = 1 [json_name = "title"];
  string description = 2 [json_name = "description"];
  uint64 revision = 3 [json_name = "revision"];
}

message DocVersionInput {
  string action = 1 [json_name = "action"];
  string id = 2 [json_name = "id"];
  string name = 3 [json_name = "name"];
  string status = 4 [json_name = "status"];
  string source = 5 [json_name = "source"];
  string mode_id = 6 [json_name = "modeID"];
  uint64 revision = 7 [json_name = "revision"];
}

message DocumentDeleteInput {
  string version = 1 [json_name = "version"];
  string id = 2 [json_name = "id"];
  uint64 revision = 3 [json_name = "revision"];
}

message DocumentHistoryReply {
  repeated DocumentRevision items = 1;
  DocumentRevision detail = 2;
}

message DocumentInput {
  string version = 1 [json_name = "version"];
  string id = 2 [json_name = "id"];
  string slug = 3 [json_name = "slug"];
  string title = 4 [json_name = "title"];
  string summary = 5 [json_name = "summary"];
  string content = 6 [json_name = "content"];
  uint64 group_id = 7 [json_name = "groupID"];
  uint64 revision = 8 [json_name = "revision"];
}

message DocumentQuery {
  string id = 1 [json_name = "id"];
  string version = 2 [json_name = "version"];
  string mode = 3 [json_name = "mode"];
  uint64 history_id = 4 [json_name = "historyId"];
}

message DocumentRevision {
  uint64 id = 1 [json_name = "id"];
  uint64 document_id = 2 [json_name = "documentId"];
  uint64 revision = 3 [json_name = "revision"];
  uint64 actor_id = 4 [json_name = "actorId"];
  string version_id = 5 [json_name = "versionId"];
  string doc_key = 6 [json_name = "docKey"];
  string slug = 7 [json_name = "slug"];
  string title = 8 [json_name = "title"];
  string summary = 9 [json_name = "summary"];
  string content_markdown = 10 [json_name = "contentMarkdown"];
  string group_title = 11 [json_name = "groupTitle"];
  string operation = 12 [json_name = "operation"];
  google.protobuf.Timestamp created_at = 13 [json_name = "createdAt"];
}

message DownloadRequest {
  string id = 1 [json_name = "id"];
}

message Empty {
}

message HealthRequest {
}

message HealthResponse {
  string service = 1 [json_name = "service"];
  string status = 2 [json_name = "status"];
}

message ProductDownload {
  string url = 1 [json_name = "url"];
  string file_name = 2 [json_name = "fileName"];
}

message UpdateWebsiteContentRequest {
  WebsiteContent value = 1 [json_name = "value"];
}

message UpdateWebsiteDownloadsRequest {
  WebsiteDownloads value = 1 [json_name = "value"];
}

message WebsiteAboutContent {
  string title = 1 [json_name = "title"];
  string description = 2 [json_name = "description"];
  string intro_title = 3 [json_name = "introTitle"];
  repeated string paragraphs = 4 [json_name = "paragraphs"];
  repeated WebsitePrinciple principles = 5 [json_name = "principles"];
  string team_title = 6 [json_name = "teamTitle"];
  string team_intro = 7 [json_name = "teamIntro"];
  repeated string team_roles = 8 [json_name = "teamRoles"];
}

message WebsiteArchitectureLayer {
  string name = 1 [json_name = "name"];
  repeated string items = 2 [json_name = "items"];
}

message WebsiteAudience {
  string index = 1 [json_name = "index"];
  string title = 2 [json_name = "title"];
  string headline = 3 [json_name = "headline"];
  string description = 4 [json_name = "description"];
}

message WebsiteBrand {
  string name = 1 [json_name = "name"];
  string full_name = 2 [json_name = "fullName"];
  string description = 3 [json_name = "description"];
  string contact_email = 4 [json_name = "contactEmail"];
  string record_number = 5 [json_name = "recordNumber"];
  string copyright = 6 [json_name = "copyright"];
}

message WebsiteCapability {
  string key = 1 [json_name = "key"];
  string index = 2 [json_name = "index"];
  string title = 3 [json_name = "title"];
  string description = 4 [json_name = "description"];
  repeated string tags = 5 [json_name = "tags"];
}

message WebsiteContent {
  WebsiteBrand brand = 1 [json_name = "brand"];
  repeated WebsiteNavigation navigation = 2 [json_name = "navigation"];
  WebsiteHomeContent home = 3 [json_name = "home"];
  repeated WebsiteCapability capabilities = 4 [json_name = "capabilities"];
  repeated WebsiteDeliveryStep delivery_steps = 5 [json_name = "deliverySteps"];
  repeated WebsiteAudience audiences = 6 [json_name = "audiences"];
  WebsiteProductContent product = 7 [json_name = "product"];
  WebsiteAboutContent about = 8 [json_name = "about"];
  WebsiteFooterContent footer = 9 [json_name = "footer"];
}

message WebsiteDeliveryStep {
  string index = 1 [json_name = "index"];
  string key = 2 [json_name = "key"];
  string title = 3 [json_name = "title"];
  string description = 4 [json_name = "description"];
}

message WebsiteDocDocument {
  uint64 revision = 1 [json_name = "revision"];
  uint64 group_id = 2 [json_name = "groupId"];
  google.protobuf.Timestamp updated_at = 3 [json_name = "updatedAt"];
  string id = 4 [json_name = "id"];
  string slug = 5 [json_name = "slug"];
  string title = 6 [json_name = "title"];
  string summary = 7 [json_name = "summary"];
  string content = 8 [json_name = "content"];
}

message WebsiteDocGroup {
  uint64 id = 1 [json_name = "id"];
  uint64 revision = 2 [json_name = "revision"];
  string title = 3 [json_name = "title"];
  repeated WebsiteDocDocument items = 4 [json_name = "items"];
}

message WebsiteDocMode {
  repeated string version_ids = 1 [json_name = "versionIds"];
  string id = 2 [json_name = "id"];
  string label = 3 [json_name = "label"];
  string description = 4 [json_name = "description"];
  string icon = 5 [json_name = "icon"];
  string status = 6 [json_name = "status"];
  bool available = 7 [json_name = "available"];
  string default_version = 8 [json_name = "defaultVersion"];
  int64 sort_order = 9 [json_name = "sortOrder"];
  uint64 revision = 10 [json_name = "revision"];
}

message WebsiteDocModes {
  string title = 1 [json_name = "title"];
  string description = 2 [json_name = "description"];
  string default_mode = 3 [json_name = "defaultMode"];
  repeated WebsiteDocMode modes = 4 [json_name = "modes"];
}

message WebsiteDocNavigationDocument {
  string id = 1 [json_name = "id"];
  string slug = 2 [json_name = "slug"];
  string title = 3 [json_name = "title"];
  string summary = 4 [json_name = "summary"];
}

message WebsiteDocNavigationGroup {
  string title = 1 [json_name = "title"];
  repeated WebsiteDocNavigationDocument items = 2 [json_name = "items"];
}

message WebsiteDocVersion {
  string mode_id = 1 [json_name = "modeId"];
  uint64 revision = 2 [json_name = "revision"];
  string id = 3 [json_name = "id"];
  string name = 4 [json_name = "name"];
  string status = 5 [json_name = "status"];
  repeated WebsiteDocGroup groups = 6 [json_name = "groups"];
}

message WebsiteDocVersionSummary {
  string id = 1 [json_name = "id"];
  string name = 2 [json_name = "name"];
}

message WebsiteDocs {
  repeated WebsiteDocMode modes = 1 [json_name = "modes"];
  string default_mode = 2 [json_name = "defaultMode"];
  uint64 revision = 3 [json_name = "revision"];
  string default_version = 4 [json_name = "defaultVersion"];
  repeated WebsiteDocVersion versions = 5 [json_name = "versions"];
  string title = 6 [json_name = "title"];
  string description = 7 [json_name = "description"];
}

message WebsiteDocsNavigation {
  string version_id = 1 [json_name = "versionId"];
  string default_version = 2 [json_name = "defaultVersion"];
  repeated WebsiteDocVersionSummary versions = 3 [json_name = "versions"];
  string title = 4 [json_name = "title"];
  string description = 5 [json_name = "description"];
  string version = 6 [json_name = "version"];
  repeated WebsiteDocNavigationGroup groups = 7 [json_name = "groups"];
}

message WebsiteDownloadGroup {
  string id = 1 [json_name = "id"];
  string name = 2 [json_name = "name"];
  string description = 3 [json_name = "description"];
}

message WebsiteDownloadPackage {
  string id = 1 [json_name = "id"];
  string group_id = 2 [json_name = "groupId"];
  string edition = 3 [json_name = "edition"];
  int64 sort_order = 4 [json_name = "sortOrder"];
  string platform = 5 [json_name = "platform"];
  string arch = 6 [json_name = "arch"];
  string format = 7 [json_name = "format"];
  string url = 8 [json_name = "url"];
  string checksum = 9 [json_name = "checksum"];
  string icon = 10 [json_name = "icon"];
  string product = 11 [json_name = "product"];
  string version = 12 [json_name = "version"];
  string description = 13 [json_name = "description"];
  string file_name = 14 [json_name = "fileName"];
  int64 size = 15 [json_name = "size"];
  string release_date = 16 [json_name = "releaseDate"];
  string status = 17 [json_name = "status"];
}

message WebsiteDownloads {
  string title = 1 [json_name = "title"];
  repeated WebsiteDownloadGroup groups = 2 [json_name = "groups"];
  string version = 3 [json_name = "version"];
  string release_date = 4 [json_name = "releaseDate"];
  string support_architectures = 5 [json_name = "supportArchitectures"];
  string description = 6 [json_name = "description"];
  repeated WebsiteDownloadPackage packages = 7 [json_name = "packages"];
  repeated WebsiteInstallOption install_options = 8 [json_name = "installOptions"];
  repeated WebsiteRequirement requirements = 9 [json_name = "requirements"];
  string support_title = 10 [json_name = "supportTitle"];
  string support_description = 11 [json_name = "supportDescription"];
}

message WebsiteFooterContent {
  string slogan = 1 [json_name = "slogan"];
  string statement = 2 [json_name = "statement"];
}

message WebsiteHomeContent {
  string eyebrow = 1 [json_name = "eyebrow"];
  string title = 2 [json_name = "title"];
  string highlight = 3 [json_name = "highlight"];
  string description = 4 [json_name = "description"];
  string primary_action = 5 [json_name = "primaryAction"];
  string secondary_action = 6 [json_name = "secondaryAction"];
  repeated string meta = 7 [json_name = "meta"];
  string capability_title = 8 [json_name = "capabilityTitle"];
  string capability_intro = 9 [json_name = "capabilityIntro"];
  string flow_title = 10 [json_name = "flowTitle"];
  string flow_intro = 11 [json_name = "flowIntro"];
  string audience_title = 12 [json_name = "audienceTitle"];
  string audience_intro = 13 [json_name = "audienceIntro"];
  string blog_title = 14 [json_name = "blogTitle"];
  string cta = 15 [json_name = "cta"];
}

message WebsiteInstallOption {
  string id = 1 [json_name = "id"];
  string title = 2 [json_name = "title"];
  string badge = 3 [json_name = "badge"];
  string description = 4 [json_name = "description"];
  string command = 5 [json_name = "command"];
}

message WebsiteNavigation {
  string label = 1 [json_name = "label"];
  string path = 2 [json_name = "path"];
}

message WebsitePrinciple {
  string index = 1 [json_name = "index"];
  string title = 2 [json_name = "title"];
  string description = 3 [json_name = "description"];
}

message WebsiteProductContent {
  string title = 1 [json_name = "title"];
  string description = 2 [json_name = "description"];
  string capability_title = 3 [json_name = "capabilityTitle"];
  string capability_intro = 4 [json_name = "capabilityIntro"];
  string architecture_title = 5 [json_name = "architectureTitle"];
  string architecture_intro = 6 [json_name = "architectureIntro"];
  repeated WebsiteArchitectureLayer architecture_layers = 7 [json_name = "architectureLayers"];
  string security_title = 8 [json_name = "securityTitle"];
  string security_intro = 9 [json_name = "securityIntro"];
  repeated WebsiteSecurityItem security_items = 10 [json_name = "securityItems"];
}

message WebsiteRequirement {
  string label = 1 [json_name = "label"];
  string value = 2 [json_name = "value"];
}

message WebsiteSecurityItem {
  string title = 1 [json_name = "title"];
  string description = 2 [json_name = "description"];
}

service Product {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Content(Empty) returns (WebsiteContent);
  rpc Downloads(Empty) returns (WebsiteDownloads);
  rpc AdminDownloads(Empty) returns (WebsiteDownloads);
  rpc Docs(Empty) returns (WebsiteDocs);
  rpc DocModes(Empty) returns (WebsiteDocModes);
  rpc ResolveDownload(DownloadRequest) returns (ProductDownload);
  rpc DocsNavigation(DocumentQuery) returns (WebsiteDocsNavigation);
  rpc Document(DocumentQuery) returns (WebsiteDocDocument);
  rpc AdminDocument(DocumentQuery) returns (WebsiteDocDocument);
  rpc SaveContent(WebsiteContent) returns (Empty);
  rpc SaveDownloads(WebsiteDownloads) returns (Empty);
  rpc SaveDocSettings(DocSettingsInput) returns (Empty);
  rpc ChangeDocMode(DocModeInput) returns (Empty);
  rpc ChangeDocVersion(DocVersionInput) returns (Empty);
  rpc ChangeDocGroup(DocGroupInput) returns (Empty);
  rpc DeleteDocument(DocumentDeleteInput) returns (Empty);
  rpc SaveDocument(DocumentInput) returns (WebsiteDocDocument);
  rpc DocumentHistory(DocumentQuery) returns (DocumentHistoryReply);
}

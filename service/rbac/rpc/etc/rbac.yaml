# Local development only. Deploy configs use reachable container addresses.
Name: rbac-rpc
ListenOn: 0.0.0.0:9801
Timeout: 30000
ServiceKey: ${SERVICE_KEY}
Database:
  Driver: mysql
  DSN: ${RBAC_DB_DSN}
Cache:
  Addr: 127.0.0.1:6379
  Password: ${REDIS_PASSWORD}
AuthSecret: ${AUTH_SECRET}
TOTP:
  Enabled: false
Mail:
  Host: ${SMTP_HOST}
  Username: ${SMTP_USERNAME}
  Password: ${SMTP_PASSWORD}
Mode: dev
ControlPlane:
  Provider: etcd
  Endpoints: ['${ETCD_ENDPOINT}']
  Prefix: /sitehub
  Namespace: ${CONTROL_NAMESPACE}
  Group: SITEHUB
  Username: ${ETCD_USERNAME}
  Password: ${ETCD_PASSWORD}
  DialTimeout: 5s
  RequestTimeout: 5s
  LeaseTTL: 15
Registry:
  Enabled: true
  AdvertiseIP: ${SERVICE_ADVERTISE_IP}
  AllowLoopback: true
  MaxStale: 30s
  StartupTimeout: 30s
ConfigCenter:
  Enabled: true
  Key: rbac-rpc.yaml
Runtime:
  Maintenance: false
  MaxConcurrentRequests: 1000
Shutdown:
  WrapUpTime: 20s
  WaitTime: 75s

# Local development only. Deploy configs use reachable container addresses.
Name: rbac-api
Host: 0.0.0.0
Port: 8801
Timeout: 30000
ServiceKey: ${SERVICE_KEY}
RPC:
  Timeout: 30000
  Target: discovery:///rbac-rpc
Mode: dev
ControlPlane:
  Provider: etcd
  Endpoints: ['${ETCD_ENDPOINT}']
  Prefix: /sitehub
  Namespace: ${CONTROL_NAMESPACE}
  Group: SITEHUB
  Username: ${ETCD_USERNAME}
  Password: ${ETCD_PASSWORD}
  DialTimeout: 5s
  RequestTimeout: 5s
  LeaseTTL: 15
Registry:
  Enabled: true
  AdvertiseIP: ${SERVICE_ADVERTISE_IP}
  AllowLoopback: true
  MaxStale: 30s
  StartupTimeout: 30s
ConfigCenter:
  Enabled: true
  Key: rbac-api.yaml
Runtime:
  Maintenance: false
  MaxConcurrentRequests: 1000
Shutdown:
  WrapUpTime: 20s
  WaitTime: 75s
BrowserSession:
  Secure: false

<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#3ab9d4">
    <meta name="description" content="Deploy 企业一体化 DevOps 运维平台，统一服务器与 Kubernetes、自动化发布、远程运维和安全审计。">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      try {
        var siteTheme = localStorage.getItem('deploy-site-theme');
        var siteDark = siteTheme ? siteTheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', siteDark);
        document.documentElement.style.colorScheme = siteDark ? 'dark' : 'light';
      } catch (_) {}
    </script>
    <title>Deploy｜企业一体化 DevOps 运维平台</title>
  </head>
  <body>
    <div id="app"></div>
    <script src="/sitehub-runtime.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

# Administration website and API routing.
routes:
  - host: admin.sitehub.local
    id: admin-rbac
    paths:
      - /v1/rbac
      - /v1/rbac/*
    priority: 100
    profile: admin
    upstream: rbac
  - host: admin.sitehub.local
    id: admin-blog
    paths:
      - /v1/blog
      - /v1/blog/*
    priority: 100
    profile: admin
    upstream: blog
  - host: admin.sitehub.local
    id: admin-product
    paths:
      - /v1/product
      - /v1/product/*
    priority: 100
    profile: admin
    upstream: product
  - host: admin.sitehub.local
    id: admin-file
    paths:
      - /v1/file
      - /v1/file/*
    priority: 100
    profile: admin
    upstream: blog
  - host: admin.sitehub.local
    id: admin-unknown
    paths:
      - /v1
    plugins:
      static-response:
        body: '{"code":404,"message":"Unknown API route"}'
        headers:
          Content-Type: application/json
        status: 404
    priority: 50
  - host: admin.sitehub.local
    id: admin-unknownall
    paths:
      - /v1/*
    plugins:
      static-response:
        body: '{"code":404,"message":"Unknown API route"}'
        headers:
          Content-Type: application/json
        status: 404
    priority: 50
  - host: admin.sitehub.local
    id: admin-web
    methods:
      - GET
      - HEAD
    paths:
      - /*
    plugins:
      strip-credentials: {}
    priority: 0
    upstream: web-admin
  - host: admin.sitehub.local
    id: admin-login
    paths:
      - /v1/rbac/auth/login
      - /v1/rbac/auth/register
    plugins:
      limit-count:
        count: 10
        window_seconds: 60
    priority: 200
    profile: admin
    upstream: rbac

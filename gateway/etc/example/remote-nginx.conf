# Edge Nginx. The three upstream names resolve to the cloud gateway on this host.
server {
    listen 2357 ssl;
    server_name www.ops-gofer.cn;

    ssl_certificate /etc/letsencrypt/live/www.ops-gofer.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.ops-gofer.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://product.sitehub.local:8082;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


# Install in the host Nginx http context (normally /etc/nginx/conf.d/sitehub-ip.conf).
map $server_port $sitehub_route_host {
    8443 product.sitehub.local;
    8444 blog.sitehub.local;
    8445 admin.sitehub.local;
}

map $http_upgrade $sitehub_connection {
    default upgrade;
    ''      '';
}

server {
    listen 8443 ssl;
    listen 8444 ssl;
    listen 8445 ssl;
    server_name 203.0.113.10;

    ssl_certificate     /etc/nginx/tls/sitehub-ip-fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/sitehub-ip.key;

    # Match the gateway limit and stream uploads/downloads to the upstream.
    client_max_body_size 2149580800;
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $sitehub_route_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sitehub_connection;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

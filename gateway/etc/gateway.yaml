Name: gateway
Listen: 0.0.0.0:9080
Source: file
Manifest: routes.yaml
Log:
  ServiceName: gateway
  Mode: console
  Level: info
Admin:
  Listen: 127.0.0.1:9180
  Key: ${GATEWAY_ADMIN_KEY}
  AllowedCIDRs: [127.0.0.1/32, '::1/128']
ControlPlane:
  Provider: etcd
  Endpoints: [127.0.0.1:2379]
  Prefix: /sitehub
  Namespace: sitehub-dev
  Group: SITEHUB
  Username: ${ETCD_USERNAME}
  Password: ${ETCD_PASSWORD}
  DialTimeout: 5s
  RequestTimeout: 5s
  LeaseTTL: 15
Discovery:
  Enabled: true
  MaxStale: 30s
HTTP:
  TrustedProxies: []
  MaxBodyBytes: 2149580800
  ReadHeaderTimeout: 10s
  IdleTimeout: 90s
  ShutdownTimeout: 60s

Console:
  Enabled: false
  Listen: 127.0.0.1:9190
  Origin: http://127.0.0.1:9190
  CookiePath: /api/
  StateDir: .tmp/gateway-releases

name: sitehub

# Business processes run on the cloud host. Middleware stays on the local VM
# and is reached through the existing frps listeners on this Linux Docker host.
# Cloud images are assembled from the compiled release package, without source.
x-control-environment: &control-environment
  ETCD_ENDPOINT: ${FRP_HOST:-host.docker.internal}:${FRP_ETCD_PORT:-24167}
  ETCD_USERNAME: ${ETCD_USERNAME:-}
  ETCD_PASSWORD: ${ETCD_PASSWORD:-}
  CONTROL_NAMESPACE: ${CONTROL_NAMESPACE:-sitehub-dev}

x-business-environment: &business-environment
  <<: *control-environment
  SERVICE_KEY: ${SERVICE_KEY:?set a service key of at least 32 characters}

x-business: &business
  platform: ${IMAGE_PLATFORM:-linux/amd64}
  restart: unless-stopped
  pull_policy: never
  extra_hosts:
    - host.docker.internal:host-gateway
  stop_grace_period: 80s

x-database-environment: &database-environment
  RBAC_DB_DSN: rbac:${RBAC_DB_PASSWORD:?copy RBAC_DB_PASSWORD from the VM}@tcp(${FRP_HOST:-host.docker.internal}:${FRP_MYSQL_PORT:-25473})/sitehub_rbac?charset=utf8mb4&parseTime=true&loc=UTC
  BLOG_DB_DSN: blog:${BLOG_DB_PASSWORD:?copy BLOG_DB_PASSWORD from the VM}@tcp(${FRP_HOST:-host.docker.internal}:${FRP_MYSQL_PORT:-25473})/sitehub_blog?charset=utf8mb4&parseTime=true&loc=UTC
  PRODUCT_DB_DSN: product:${PRODUCT_DB_PASSWORD:?copy PRODUCT_DB_PASSWORD from the VM}@tcp(${FRP_HOST:-host.docker.internal}:${FRP_MYSQL_PORT:-25473})/sitehub_product?charset=utf8mb4&parseTime=true&loc=UTC
  FILE_DB_DSN: file:${FILE_DB_PASSWORD:?copy FILE_DB_PASSWORD from the VM}@tcp(${FRP_HOST:-host.docker.internal}:${FRP_MYSQL_PORT:-25473})/sitehub_file?charset=utf8mb4&parseTime=true&loc=UTC

services:
  database-init:
    image: ${IMAGE_PREFIX:-sitehub}/bootstrap:${IMAGE_TAG:-local}
    platform: ${IMAGE_PLATFORM:-linux/amd64}
    pull_policy: never
    command: [-all, -ensure-admin]
    restart: "no"
    profiles: [init]
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      <<: *database-environment
      GATEWAY_CONSOLE_URL: ${GATEWAY_CONSOLE_URL:-}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}

  config-init:
    image: ${IMAGE_PREFIX:-sitehub}/configctl:${IMAGE_TAG:-local}
    platform: ${IMAGE_PLATFORM:-linux/amd64}
    pull_policy: never
    command: [--dir, /config]
    restart: "no"
    profiles: [init]
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      <<: *control-environment
    volumes:
      - ./etcd/config:/config:ro

  rbac-rpc:
    <<: *business
    image: ${IMAGE_PREFIX:-sitehub}/rbac-rpc:${IMAGE_TAG:-local}
    command: [-f, /app/etc/service.yaml]
    volumes:
      - ./config/rbac-rpc.yaml:/app/etc/service.yaml:ro
    environment:
      <<: *business-environment
      RBAC_DB_DSN: rbac:${RBAC_DB_PASSWORD:?copy RBAC_DB_PASSWORD from the VM}@tcp(${FRP_HOST:-host.docker.internal}:${FRP_MYSQL_PORT:-25473})/sitehub_rbac?charset=utf8mb4&parseTime=true&loc=UTC
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      REDIS_ADDR: ${FRP_HOST:-host.docker.internal}:${FRP_REDIS_PORT:-28619}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?copy REDIS_PASSWORD from the VM}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}

  rbac-api:
    <<: *business
    image: ${IMAGE_PREFIX:-sitehub}/rbac-api:${IMAGE_TAG:-local}
    command: [-f, /app/etc/service.yaml]
    volumes:
      - ./config/rbac-api.yaml:/app/etc/service.yaml:ro
    environment:
      <<: *business-environment
      WEB_COOKIE_SECURE: ${WEB_COOKIE_SECURE:-false}
    depends_on:
      rbac-rpc:
        condition: service_started

  blog-api:
    <<: *business
    image: ${IMAGE_PREFIX:-sitehub}/blog-api:${IMAGE_TAG:-local}
    command: [-f, /app/etc/service.yaml]
    volumes:
      - ./config/blog-api.yaml:/app/etc/service.yaml:ro
      - files:/data/files
      - private-files:/data/files-private
    environment:
      <<: *business-environment
      BLOG_DB_DSN: blog:${BLOG_DB_PASSWORD:?copy BLOG_DB_PASSWORD from the VM}@tcp(${FRP_HOST:-host.docker.internal}:${FRP_MYSQL_PORT:-25473})/sitehub_blog?charset=utf8mb4&parseTime=true&loc=UTC
      FILE_DB_DSN: file:${FILE_DB_PASSWORD:?copy FILE_DB_PASSWORD from the VM}@tcp(${FRP_HOST:-host.docker.internal}:${FRP_MYSQL_PORT:-25473})/sitehub_file?charset=utf8mb4&parseTime=true&loc=UTC
      STORAGE_SECRET: ${STORAGE_SECRET:?set STORAGE_SECRET}

  product-api:
    <<: *business
    image: ${IMAGE_PREFIX:-sitehub}/product-api:${IMAGE_TAG:-local}
    command: [-f, /app/etc/service.yaml]
    volumes:
      - ./config/product-api.yaml:/app/etc/service.yaml:ro
    environment:
      <<: *business-environment
      PRODUCT_DB_DSN: product:${PRODUCT_DB_PASSWORD:?copy PRODUCT_DB_PASSWORD from the VM}@tcp(${FRP_HOST:-host.docker.internal}:${FRP_MYSQL_PORT:-25473})/sitehub_product?charset=utf8mb4&parseTime=true&loc=UTC

  web-product:
    image: ${IMAGE_PREFIX:-sitehub}/web-product:${IMAGE_TAG:-local}
    platform: ${IMAGE_PLATFORM:-linux/amd64}
    pull_policy: never
    environment:
      WEB_PRODUCT_URL: ${WEB_PRODUCT_URL:-}
      WEB_BLOG_URL: ${WEB_BLOG_URL:-}
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  web-blog:
    image: ${IMAGE_PREFIX:-sitehub}/web-blog:${IMAGE_TAG:-local}
    platform: ${IMAGE_PLATFORM:-linux/amd64}
    pull_policy: never
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  web-admin:
    image: ${IMAGE_PREFIX:-sitehub}/web-admin:${IMAGE_TAG:-local}
    platform: ${IMAGE_PLATFORM:-linux/amd64}
    pull_policy: never
    environment:
      WEB_SITE_URL: ${WEB_SITE_URL:-}
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  gateway:
    image: ${IMAGE_PREFIX:-sitehub}/gateway:${IMAGE_TAG:-local}
    platform: ${IMAGE_PLATFORM:-linux/amd64}
    pull_policy: never
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - ${GATEWAY_PORT:-8082}:9080
      - 127.0.0.1:${GATEWAY_CONSOLE_PORT:-9190}:9190
    environment:
      <<: *control-environment
      GATEWAY_ADMIN_KEY: ${GATEWAY_ADMIN_KEY:?set a gateway control key of at least 32 characters}
      GATEWAY_CONSOLE_ORIGIN: ${GATEWAY_CONSOLE_ORIGIN:-http://127.0.0.1:9190}
      GATEWAY_CONSOLE_COOKIE_PATH: ${GATEWAY_CONSOLE_COOKIE_PATH:-/}
    depends_on:
      rbac-api:
        condition: service_started
      blog-api:
        condition: service_started
      product-api:
        condition: service_started
      web-blog:
        condition: service_healthy
      web-product:
        condition: service_healthy
      web-admin:
        condition: service_healthy
    networks:
      default: {}
      control:
        aliases: [gateway-control]
    stop_grace_period: 65s
    healthcheck:
      test: [CMD, /app/gateway, health, -f, /app/etc/gateway.yaml]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - ./gateway/gateway.yaml:/app/etc/gateway.yaml:ro
      - gateway-releases:/data/releases
      - ./gateway/routes.json:/app/etc/routes.json:ro

  gateway-publish:
    image: ${IMAGE_PREFIX:-sitehub}/gatewayctl:${IMAGE_TAG:-local}
    platform: ${IMAGE_PLATFORM:-linux/amd64}
    pull_policy: never
    command: [publish, --manifest, /app/manifests/routes.json, -f, /app/etc/gatewayctl.yaml]
    environment:
      GATEWAY_ADMIN_KEY: ${GATEWAY_ADMIN_KEY:?set GATEWAY_ADMIN_KEY}
    volumes:
      - ./gateway:/app/manifests:ro
      - ./gateway/gatewayctl.yaml:/app/etc/gatewayctl.yaml:ro
      - gateway-releases:/data/releases
    depends_on:
      gateway:
        condition: service_healthy
    networks: [control]
    profiles: [ops]

volumes:
  files:
  private-files:
  gateway-releases:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  control:
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/24

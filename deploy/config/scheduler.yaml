Name: scheduler
ServiceKey: ${SERVICE_KEY}
BlogRPC:
  Timeout: 120000
  Target: nacos:///blog-rpc
PublishSchedule: '@every 1m'
CleanupSchedule: 0 0 * * * *
JobTimeout: 2m
Nacos:
  Servers:
  - nacos:8848
  NamespaceID: ${NACOS_NAMESPACE_ID}
  Group: SITEHUB
  Username: ${NACOS_USERNAME}
  Password: ${NACOS_PASSWORD}
  StateDir: /app/.nacos
Registry:
  Enabled: true
  AdvertiseIP: ${HOSTNAME}
  MaxStale: 30s
  StartupTimeout: 30s
ConfigCenter:
  Enabled: true
  DataID: scheduler.yaml
Runtime:
  Maintenance: false
  MaxConcurrentRequests: 1000
Shutdown:
  WrapUpTime: 10s
  WaitTime: 75s
Management:
  ListenOn: 0.0.0.0:9900

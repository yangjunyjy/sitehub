# Local bootstrap and instance settings. Runtime settings: etcd rbac-api.yaml.
Name: rbac-api
Host: 0.0.0.0
Port: 8801
ServiceKey: ${SERVICE_KEY}
ControlPlane:
  Provider: etcd
  Endpoints: ['${ETCD_ENDPOINT}']
  Prefix: /sitehub
  Namespace: ${CONTROL_NAMESPACE}
  Group: SITEHUB
  Username: ${ETCD_USERNAME}
  Password: ${ETCD_PASSWORD}
  DialTimeout: 5s
  RequestTimeout: 5s
  LeaseTTL: 15
Registry:
  AdvertiseIP: ${HOSTNAME}
ConfigCenter:
  Enabled: true
  Key: rbac-api.yaml
Shutdown:
  WrapUpTime: 20s
  WaitTime: 75s
Management:
  ListenOn: 0.0.0.0:9900
BrowserSession:
  Secure: ${WEB_COOKIE_SECURE}

# Local bootstrap, connection credentials and instance settings.
# Runtime settings: etcd rbac-rpc.yaml (see etcd/README.md in the release).
Name: rbac-rpc
ListenOn: 0.0.0.0:9801
ServiceKey: ${SERVICE_KEY}
Database:
  DSN: ${RBAC_DB_DSN}
Cache:
  Addr: ${REDIS_ADDR}
  Password: ${REDIS_PASSWORD}
AuthSecret: ${AUTH_SECRET}
Mail:
  Host: ${SMTP_HOST}
  Username: ${SMTP_USERNAME}
  Password: ${SMTP_PASSWORD}
ControlPlane:
  Provider: etcd
  Endpoints: ['${ETCD_ENDPOINT}']
  Prefix: /sitehub
  Namespace: ${CONTROL_NAMESPACE}
  Group: SITEHUB
  Username: ${ETCD_USERNAME}
  Password: ${ETCD_PASSWORD}
  DialTimeout: 5s
  RequestTimeout: 5s
  LeaseTTL: 15
Registry:
  AdvertiseIP: ${HOSTNAME}
ConfigCenter:
  Enabled: true
  Key: rbac-rpc.yaml
Shutdown:
  WrapUpTime: 20s
  WaitTime: 75s
Management:
  ListenOn: 0.0.0.0:9900

Name: file-rpc
ListenOn: 0.0.0.0:9804
Timeout: 30000
ServiceKey: ${SERVICE_KEY}
Database:
  Driver: mysql
  DSN: ${FILE_DB_DSN}
RbacRPC:
  Timeout: 5000
  Target: nacos:///rbac-rpc
StorageRoot: /data/files
StorageSecret: ${STORAGE_SECRET}
PublicBaseURL: ''
Nacos:
  Servers:
  - nacos:8848
  NamespaceID: ${NACOS_NAMESPACE_ID}
  Group: SITEHUB
  Username: ${NACOS_USERNAME}
  Password: ${NACOS_PASSWORD}
  StateDir: /app/.nacos
Registry:
  Enabled: true
  AdvertiseIP: ${HOSTNAME}
  MaxStale: 30s
  StartupTimeout: 30s
ConfigCenter:
  Enabled: true
  DataID: file-rpc.yaml
Runtime:
  Maintenance: false
  MaxConcurrentRequests: 1000
Shutdown:
  WrapUpTime: 10s
  WaitTime: 75s
Management:
  ListenOn: 0.0.0.0:9900

# Local bootstrap and instance settings. Runtime settings: etcd blog-api.yaml.
Name: blog-api
Host: 0.0.0.0
Port: 8802
ServiceKey: ${SERVICE_KEY}
Database:
  DSN: ${BLOG_DB_DSN}
FileDatabase:
  DSN: ${FILE_DB_DSN}
StorageSecret: ${STORAGE_SECRET}
ControlPlane:
  Provider: etcd
  Endpoints: ['${ETCD_ENDPOINT}']
  Prefix: /sitehub
  Namespace: ${CONTROL_NAMESPACE}
  Group: SITEHUB
  Username: ${ETCD_USERNAME}
  Password: ${ETCD_PASSWORD}
  DialTimeout: 5s
  RequestTimeout: 5s
  LeaseTTL: 15
Registry:
  AdvertiseIP: ${HOSTNAME}
ConfigCenter:
  Enabled: true
  Key: blog-api.yaml
Shutdown:
  WrapUpTime: 20s
  WaitTime: 75s
Management:
  ListenOn: 0.0.0.0:9900

Name: gateway
Source: etcd
Listen: 0.0.0.0:9080
Manifest: /app/etc/routes.json
Log:
  ServiceName: gateway
  Mode: console
  Level: info
Admin:
  Listen: 0.0.0.0:9180
  Key: ${GATEWAY_ADMIN_KEY}
  AllowedCIDRs: [127.0.0.1/32, 172.31.0.0/24]
Etcd:
  Endpoints: ['${ETCD_ENDPOINT}']
  Username: ${ETCD_USERNAME}
  Password: ${ETCD_PASSWORD}
  Key: /sitehub/gateway/v1/config
ControlPlane:
  Provider: etcd
  Endpoints: ['${ETCD_ENDPOINT}']
  Prefix: /sitehub
  Namespace: ${CONTROL_NAMESPACE}
  Group: SITEHUB
  Username: ${ETCD_USERNAME}
  Password: ${ETCD_PASSWORD}
  DialTimeout: 5s
  RequestTimeout: 5s
  LeaseTTL: 15
Discovery:
  Enabled: true
  MaxStale: 30s
HTTP:
  MaxBodyBytes: 2149580800
  ReadHeaderTimeout: 10s
  IdleTimeout: 90s
  ShutdownTimeout: 60s

Console:
  Enabled: true
  Listen: 0.0.0.0:9190
  Origin: ${GATEWAY_CONSOLE_ORIGIN}
  TrustedProxies: [127.0.0.1/32, 172.30.0.1/32, 172.31.0.1/32]
  RBACAddress: rbac-rpc:9801
  ServiceKey: ${SERVICE_KEY}
  StateDir: /data/releases
